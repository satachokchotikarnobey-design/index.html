<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เพื่อน้องพี่ทำได้</title>

<style>

body{
margin:0;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:#ffd6e7;
font-family:Arial,sans-serif;
}

.poster{
width:1200px;
height:650px;
background:linear-gradient(135deg,#ffb8d4,#ffd8ea,#fff0f7);
border-radius:35px;
box-shadow:0 10px 30px rgba(0,0,0,.25);
padding:25px;
overflow:hidden;
position:relative;
}

/* หัว */
.title{
text-align:center;
font-size:70px;
font-weight:bold;
color:#ff2f7c;
-webkit-text-stroke:3px #fff;
text-shadow:0 4px 12px rgba(255,0,120,.3);
}

.sub{
text-align:center;
font-size:28px;
background:#ff4d94;
color:white;
padding:10px;
border-radius:18px;
width:420px;
margin:auto;
margin-top:10px;
}

/* เนื้อหา */
.main{
display:flex;
margin-top:35px;
gap:40px;
}

/* ช่องรูป */
.photo{
width:450px;
height:450px;
background:white;
border:8px solid #ff5ea6;
border-radius:50px;
display:flex;
justify-content:center;
align-items:center;
font-size:35px;
font-weight:bold;
color:#ff5ea6;
box-shadow:0 0 15px rgba(255,0,120,.2);
}

/* ด้านขวา */
.right{
flex:1;
display:flex;
justify-content:center;
align-items:center;
}

.card{
background:rgba(255,255,255,.85);
width:100%;
height:450px;
border-radius:35px;
padding:30px;
box-shadow:0 0 18px rgba(0,0,0,.1);
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
}

.logo{
font-size:45px;
color:#ff2f7c;
font-weight:bold;
margin-bottom:20px;
}

.slogan{
font-size:35px;
color:#ff4d94;
text-align:center;
font-weight:bold;
}

/* ตกแต่ง */
.heart{
position:absolute;
font-size:50px;
opacity:.7;
}

.h1{top:25px;left:25px;}
.h2{bottom:20px;right:30px;}
.h3{top:100px;right:80px;}

</style>
</head>
<body>

<div class="poster">

<div class="heart h1">💖</div>
<div class="heart h2">🎀</div>
<div class="heart h3">✨</div>

<div class="title">
เพื่อน้องพี่ทำได้
</div>

<div class="sub">
ใส่ใจทุกคน • ร่วมกันพัฒนาโรงเรียนของเรา
</div>

<div class="main">

<div class="photo">
</div>

<div class="right">

<div class="card">

<div class="logo">
🩷 เพื่อน้องพี่ทำได้
</div>

<div class="slogan">
เลือกเรา<br>
เลือกอนาคตที่ดีกว่า ✨
</div>

</div>

</div>

</div>

</div>

</body>
</html>
