<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>โหวตพรรค เพื่อน้องพี่ทำได้</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: url("policy.jpg") no-repeat center center fixed;
  background-size: cover;
  text-align: center;
}

/* กล่องโปร่งใส */
.box {
  background: rgba(255,255,255,0.92);
  width: 360px;
  margin: 50px auto;
  padding: 20px;
  border-radius: 20px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}

/* รูปพรรค */
.party-img {
  width: 120px;
  height: 120px;
  border-radius: 20px;
  object-fit: cover;
  border: 4px solid #ff4d6d;
  margin-top: -60px;
  background: white;
}

/* หัวข้อ */
h1 {
  color: #ff4d6d;
  margin-top: 10px;
}

/* ปุ่ม */
button {
  margin-top: 15px;
  padding: 12px;
  width: 100%;
  border: none;
  border-radius: 12px;
  background: linear-gradient(45deg, #ff4d6d, #ff8fa3);
  color: white;
  font-size: 16px;
  cursor: pointer;
}

/* ผลโหวต */
.result {
  margin-top: 15px;
  font-weight: bold;
  font-size: 18px;
}
</style>
</head>

<body>

<div class="box">

  <!-- รูปพรรค -->
  <img src="party.jpg" class="party-img">

  <h1>พรรค เพื่อน้องพี่ทำได้</h1>

  <p>✔ เอาผ้าอนามัยไว้ในห้องน้ำหญิง<br>
     ✔ เก็บขยะเช้า-เที่ยง<br>
     ✔ ช่วยการบ้านน้อง ๆ</p>

  <label>
    <input type="checkbox" id="voteCheck">
    ฉันเลือกพรรคนี้
  </label>

  <button onclick="vote()">โหวตเลย</button>

  <div class="result" id="result"></div>
</div>

<script>
let votes = localStorage.getItem("voteCount") || 0;

function vote() {
  let check = document.getElementById("voteCheck");

  if (!check.checked) {
    alert("กรุณาติ๊กเลือกพรรคก่อน!");
    return;
  }

  votes++;
  localStorage.setItem("voteCount", votes);

  document.getElementById("result").innerHTML =
    "📊 จำนวนคนโหวต: " + votes + " คน";
}

document.getElementById("result").innerHTML =
  "📊 จำนวนคนโหวต: " + votes + " คน";
</script>

</body>
</html>
