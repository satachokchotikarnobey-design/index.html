<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>ระบบโหวตพรรค</title>

<style>
  body {
    font-family: Arial;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    text-align: center;
    padding: 20px;
  }

  .box {
    background: white;
    padding: 20px;
    border-radius: 20px;
    width: 350px;
    margin: auto;
    box-shadow: 0 10px 20px rgba(0,0,0,0.2);
  }

  h1 {
    color: #ff4d6d;
  }

  .party {
    text-align: left;
    margin: 10px 0;
    padding: 10px;
    border-radius: 10px;
    background: #f5f5f5;
  }

  button {
    margin-top: 15px;
    padding: 10px;
    width: 100%;
    border: none;
    border-radius: 10px;
    background: #4CAF50;
    color: white;
    font-size: 16px;
    cursor: pointer;
  }

  .result {
    margin-top: 20px;
    font-size: 18px;
    font-weight: bold;
  }
</style>
</head>

<body>

<div class="box">
  <h1>เลือกพรรคที่คุณชอบ</h1>

  <div class="party">
    <input type="radio" name="party" value="เพื่อน้องพี่ทำได้"> พรรค เพื่อน้องพี่ทำได้
  </div>

  <div class="party">
    <input type="radio" name="party" value="พลังเยาวชน"> พรรค พลังเยาวชน
  </div>

  <div class="party">
    <input type="radio" name="party" value="รวมใจพัฒนา"> พรรค รวมใจพัฒนา
  </div>

  <button onclick="vote()">โหวตเลย</button>

  <div class="result" id="result"></div>
</div>

<script>
let votes = JSON.parse(localStorage.getItem("votes")) || {
  "เพื่อน้องพี่ทำได้": 0,
  "พลังเยาวชน": 0,
  "รวมใจพัฒนา": 0
};

function vote() {
  let selected = document.querySelector('input[name="party"]:checked');

  if (!selected) {
    alert("กรุณาเลือกพรรคก่อน!");
    return;
  }

  votes[selected.value] += 1;

  localStorage.setItem("votes", JSON.stringify(votes));

  showResult();
}

function showResult() {
  document.getElementById("result").innerHTML =
    "📊 ผลโหวตตอนนี้<br><br>" +
    "เพื่อน้องพี่ทำได้: " + votes["เพื่อน้องพี่ทำได้"] + "<br>" +
    "พลังเยาวชน: " + votes["พลังเยาวชน"] + "<br>" +
    "รวมใจพัฒนา: " + votes["รวมใจพัฒนา"];
}

showResult();
</script>

</body>
</html>
