<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>เพื่อน้องพี่ทำได้</title>

<style>
body{
margin:0;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:#ffd6e7;
font-family:Arial,sans-serif;
}

.poster{
width:1000px;
height:500px;
background:linear-gradient(135deg,#ffb6d5,#ffcce2,#ffe3ef);
border-radius:35px;
display:flex;
overflow:hidden;
box-shadow:0 15px 35px rgba(0,0,0,0.25);
}

.left{
width:40%;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.photo-box{
width:300px;
height:300px;
border:5px dashed #ff5fa2;
border-radius:25px;
background:white;
display:flex;
justify-content:center;
align-items:center;
color:#ff5fa2;
font-size:24px;
font-weight:bold;
}

.right{
width:60%;
display:flex;
flex-direction:column;
justify-content:center;
padding:50px;
color:white;
}

.title{
font-size:65px;
font-weight:bold;
color:#ff2e7a;
}

.sub{
font-size:28px;
color:#ffffff;
margin-top:10px;
background:#ff6fae;
display:inline-block;
padding:10px 20px;
border-radius:18px;
}

.hearts{
font-size:35px;
margin-top:25px;
}
</style>

</head>
<body>

<div class="poster">

<div class="left">
<div class="photo-box">
ใส่รูปตรงนี้
</div>
</div>

<div class="right">
<div class="title">
เพื่อน้องพี่ทำได้
</div>

<div class="sub">
น่ารัก • สดใส • สีชมพู
</div>

<div class="hearts">
🩷 ✨ 🌸 🎀 ⭐
</div>

</div>

</div>

</body>
</html>
